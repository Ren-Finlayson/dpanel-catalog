additionalProperties:
  supportVersion: 2.0
  formFields:
    - default: 80
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      required: true
      type: number
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 端口
    - default: 443
      envKey: PANEL_APP_PORT_HTTPS
      labelEn: HTTPS Port
      labelZh: HTTPS 端口
      required: true
      type: number
      label:
        en: HTTPS Port
        zh: HTTPS 端口
        zh-Hant: HTTPS 端口
    - default: www
      envKey: WEBSITE_DIR
      labelEn: Website Dir
      labelZh: 网站目录
      required: true
      type: text
      label:
        en: Website directory
        zh: 网站目录
        zh-Hant: 網站目錄
      description:
        en: A relative path is placed under the dPanel data directory; enter an absolute path to put websites elsewhere
        zh: 相对路径会放在 dPanel 数据目录下，如需放到其他位置请填写绝对路径
        zh-Hant: 相對路徑會放在 dPanel 資料目錄下，如需放到其他位置請填寫絕對路徑

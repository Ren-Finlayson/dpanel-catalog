additionalProperties:
  formFields:
    - default: redis
      envKey: PANEL_REDIS_ROOT_PASSWORD
      labelEn: Database Password
      labelZh: 数据库密码
      label:
        en: Database Password
        zh: 数据库密码
        zh-Hant: 資料庫密碼
      random: true
      # dPanel requires a password: an open Redis on a shared Docker network is
      # readable and writable by every container on it.
      required: true
      type: password
    - default: 6379
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      label:
        en: Port
        zh: 端口
        zh-Hant: 端口
      required: true
      rule: paramPort
      type: number
